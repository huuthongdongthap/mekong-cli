# Mekong CLI — LLM Provider Configuration
# Qwen3 Local (Ollama) — Primary Config

providers:
  - name: qwen3-local
    type: openai_compatible
    base_url: http://localhost:11434/v1
    api_key_env: LLM_API_KEY
    model: qwen3-coder-next:latest
    timeout: 120
    priority: 0

  - name: ollama-fallback
    type: openai_compatible
    base_url: http://localhost:11434/v1
    api_key_env: LLM_API_KEY
    model: qwen3.6:35b-a3b
    timeout: 60
    priority: 1

defaults:
  model: qwen3-coder-next:latest
  temperature: 0.7
  max_tokens: 4096
  timeout: 120

circuit_breaker:
  max_failures: 3
  cooldown_secs: 15
