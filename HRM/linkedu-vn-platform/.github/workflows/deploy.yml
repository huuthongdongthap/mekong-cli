name: Deploy — staging / production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm --filter @linkedu/api jest --passWithNoTests
      - run: pnpm --filter web test -- --passWithNoTests

  docker-build:
    needs: lint-test-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/linkededu-api:${{ github.sha }}
          push: true
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/web/Dockerfile
          tags: ghcr.io/${{ github.repository_owner }}/linkededu-web:${{ github.sha }}
          push: true

  deploy-staging:
    needs: docker-build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: appleboy/ssh-action@v1.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/linkededu && docker compose pull && docker compose up -d --force-recreate
            echo "staging deployed"

  smoke-test-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Health check API
        run: |
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}/api/v1/health" || echo "000")
            if [ "$STATUS" = "200" ]; then echo "API healthy"; exit 0; fi
            sleep 5
          done
          echo "API health check failed"; exit 1
      - name: Health check Web
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_URL }}" || echo "000")
          if [ "$STATUS" = "200" ]; then echo "Web healthy"; else echo "Web check failed: $STATUS"; exit 1; fi

  deploy-production:
    needs: smoke-test-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/linkededu && docker compose pull && docker compose up -d --force-recreate
            echo "production deployed"
