<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Mekong AgencyOS</title>

    <style>
        :root {
            --md-sys-color-primary: #6750A4;
            --md-sys-color-on-primary: #FFFFFF;
            --md-sys-color-primary-container: #EADDFF;
            --md-sys-color-on-primary-container: #21005D;
            --md-sys-color-background: #FFFBFE;
            --md-sys-color-on-background: #1C1B1F;
            --md-sys-color-surface: #FFFBFE;
            --md-sys-color-on-surface: #1C1B1F;
            --md-sys-color-surface-variant: #E7E0EC;
            --md-sys-color-on-surface-variant: #49454F;
            --md-sys-color-outline: #79747E;

            /* Shape corners */
            --md-sys-shape-corner-large: 16px;
            --md-sys-shape-corner-medium: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Roboto, sans-serif;
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-background);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            text-align: center;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .offline-icon {
            font-size: 64px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--md-sys-color-on-surface);
        }

        p {
            font-size: 16px;
            color: var(--md-sys-color-on-surface-variant);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .status {
            background-color: var(--md-sys-color-surface-variant);
            color: var(--md-sys-color-on-surface-variant);
            padding: 8px 16px;
            border-radius: var(--md-sys-shape-corner-medium);
            font-size: 14px;
            margin-bottom: 24px;
        }

        .button {
            padding: 12px 24px;
            border: none;
            border-radius: var(--md-sys-shape-corner-large);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }

        .button-primary {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .button-primary:hover {
            opacity: 0.9;
        }

        .retry-message {
            margin-top: 16px;
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="offline-icon">✈️</div>
        <h1>You're Offline</h1>
        <p>Mekong AgencyOS requires an internet connection to access all features. Some content may be limited while offline.</p>

        <div class="status" id="connectionStatus">Checking connection...</div>

        <button class="button button-primary" id="refreshButton">Try Again</button>

        <p class="retry-message">This page will automatically reload when connection is restored.</p>
    </div>

    <script>
        // Check connection status
        function updateConnectionStatus() {
            const statusElement = document.getElementById('connectionStatus');

            if (navigator.onLine) {
                statusElement.textContent = 'Connected';
                statusElement.style.backgroundColor = 'lightgreen';
                statusElement.style.color = 'darkgreen';

                // Automatically redirect to main page if online
                setTimeout(() => {
                    window.location.href = '/';
                }, 1500);
            } else {
                statusElement.textContent = 'Offline';
                statusElement.style.backgroundColor = 'lightcoral';
                statusElement.style.color = 'darkred';
            }
        }

        // Refresh button functionality
        document.getElementById('refreshButton').addEventListener('click', () => {
            window.location.reload();
        });

        // Update status on load and periodically
        updateConnectionStatus();
        setInterval(updateConnectionStatus, 2000);

        // Listen for online/offline events
        window.addEventListener('online', updateConnectionStatus);
        window.addEventListener('offline', updateConnectionStatus);
    </script>
</body>
</html>
